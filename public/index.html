<script>
async function send() {

  const text = ta.value.trim();

  if (!text || loading) return;

  const conv = getOrCreate(text);

  ta.value = '';
  ta.style.height = 'auto';
  sb.disabled = true;
  loading = true;
  charCount.textContent = '';

  addMsg('user', text);

  addTyping();

  try {

    // =========================
    // DETECTION IMAGE
    // =========================

    const imageKeywords = [
      "genere",
      "génère",
      "dessine",
      "cree",
      "crée",
      "image",
      "photo",
      "illustration",
      "logo",
      "wallpaper",
      "render",
      "portrait",
      "anime",
      "3d",
      "dessin"
    ];

    const wantsImage = imageKeywords.some(keyword =>
      text.toLowerCase().includes(keyword)
    );

    // =========================
    // GENERATION IMAGE
    // =========================

    if (wantsImage) {

      rmTyping();

      const imageUrl =
        `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}`;

      const row = document.createElement('div');
      row.className = 'row assistant';

      row.innerHTML = `
        <div class="av ai">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>

        <div style="display:flex;flex-direction:column;max-width:76%">
          <div class="bubble ai">
            <img 
              src="${imageUrl}" 
              alt="Image générée"
              style="
                width:100%;
                border-radius:12px;
                display:block;
                border:1px solid rgba(74,139,111,0.2);
                margin-bottom:10px;
              "
            >
            Image générée avec Pollinations.ai
          </div>

          <div class="msg-time">
            ${fmtTime(Date.now())}
          </div>
        </div>
      `;

      msgEl.appendChild(row);

      msgEl.scrollTop = msgEl.scrollHeight;

      const c = convs[currentId];

      c.messages.push({
        role: 'assistant',
        content: '[Image générée]'
      });

      save();

      renderSidebar();

      loading = false;

      return;
    }

    // =========================
    // CHAT NORMAL
    // =========================

    const cleanedMessages = conv.messages
      .filter(m => m.role && m.content)
      .map(m => ({
        role: m.role,
        content: m.content
      }));

    const r = await fetch('/api/chat', {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({

        model: "llama-3.3-70b-versatile",

        messages: [
          {
            role: "system",
            content: SYSTEM
          },

          ...cleanedMessages
        ]
      })
    });

    const d = await r.json();

    if (!r.ok) {

      throw new Error(
        d?.error?.message ||
        d?.message ||
        ('Erreur ' + r.status)
      );
    }

    const reply =
      d.choices?.[0]?.message?.content ||
      'Aucune réponse.';

    rmTyping();

    addMsg('assistant', reply);

  } catch (e) {

    rmTyping();

    addMsg(
      'assistant',
      '❌ ' + e.message
    );

  } finally {

    loading = false;

    sb.disabled = !ta.value.trim();

  }
}
</script>
